version: '3.8'

services:
  sima-db:
    image: mysql:8.0
    container_name: sima_bpjs_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: sima_bpjs
    ports:
      - "3306:3306"
    volumes:
      - sima_mysql_data:/var/lib/mysql

  sima-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sima_bpjs_api
    restart: always
    environment:
      - SIMA_DB_CONNECTION=server=sima-db;port=3306;database=sima_bpjs;user=root;password=rootpassword123;
      - SIMA_JWT_SECRET=supersecretkey123456789012345678901234567890
      - ENABLE_SWAGGER=true
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5189:8080"
    depends_on:
      - sima-db

volumes:
  sima_mysql_data:

